workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
    - when: never

stages: [validate, test, build, integration, publish, staging, production]

default:
  tags: [deploydock-linux]
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.python_job:
  cache:
    key:
      files: [app/backend/requirements.txt, ci/lint-requirements.txt]
    paths: [.cache/pip/]
  before_script:
    - python3 -m venv .venv
    - source .venv/bin/activate

quality:
  extends: .python_job
  stage: validate
  script:
    - pip install -q -r ci/lint-requirements.txt
    - ci/validate

unit:
  extends: .python_job
  stage: test
  script:
    - pip install -q --require-hashes --only-binary=:all: -r app/backend/requirements.txt
    - PYTHONPATH=app/backend python -m unittest discover -s tests/unit
    - bash tests/unit/test_release.sh

build_images:
  stage: build
  script:
    - |
      set -euo pipefail
      web_tag="deploydock-ci/web:$CI_JOB_ID"
      api_tag="deploydock-ci/api:$CI_JOB_ID"
      docker build --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" -t "$web_tag" -f app/frontend/Dockerfile .
      docker build --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" -t "$api_tag" -f app/backend/Dockerfile .
      docker image save "$web_tag" "$api_tag" | gzip -1 > images.tar.gz
      printf '%s\n' "$web_tag" "$api_tag" > image-tags
  after_script:
    - docker image rm "deploydock-ci/web:$CI_JOB_ID" "deploydock-ci/api:$CI_JOB_ID" || true
  artifacts:
    paths: [images.tar.gz, image-tags]
    expire_in: 1 day

integration:
  stage: integration
  needs: [build_images]
  script:
    - mapfile -t image_tags < image-tags
    - docker image load -i images.tar.gz
    - tests/integration/release.sh "${image_tags[0]}" "${image_tags[1]}"
    - sha256sum images.tar.gz image-tags > tested-images.sha256
  after_script:
    - if mapfile -t image_tags < image-tags; then docker image rm "${image_tags[@]}" || true; fi
  artifacts:
    paths: [tested-images.sha256]
    expire_in: 1 day

publish:
  stage: publish
  needs:
    - job: build_images
      artifacts: true
    - job: integration
      artifacts: true
  script:
    - |
      set -euo pipefail
      : "${CI_REGISTRY_IMAGE:?Enable the GitLab container registry}"
      export DOCKER_CONFIG
      DOCKER_CONFIG=$(mktemp -d /tmp/deploydock-registry.XXXXXXXX)
      trap 'rm -f -- "$DOCKER_CONFIG/config.json"; rmdir -- "$DOCKER_CONFIG"' EXIT
      release="$CI_COMMIT_SHA-$CI_PIPELINE_ID-$CI_JOB_ID"
      web_tag="$CI_REGISTRY_IMAGE/web:$release"
      api_tag="$CI_REGISTRY_IMAGE/api:$release"
      sha256sum --check tested-images.sha256
      mapfile -t image_tags < image-tags
      docker image load -i images.tar.gz
      docker tag "${image_tags[0]}" "$web_tag"
      docker tag "${image_tags[1]}" "$api_tag"
      printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
      web=$(scripts/push-image "$web_tag")
      api=$(scripts/push-image "$api_tag")
      jq -n --arg release "$release" --arg web "$web" --arg api "$api" \
        '{deploydock_release:$release,deploydock_web_image:$web,deploydock_api_image:$api}' > release.json
  after_script:
    - if mapfile -t image_tags < image-tags; then docker image rm "${image_tags[@]}" || true; fi
    - docker image rm "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA-$CI_PIPELINE_ID-$CI_JOB_ID" "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA-$CI_PIPELINE_ID-$CI_JOB_ID" || true
  artifacts:
    paths: [release.json]
    expire_in: 30 days

.deploy:
  extends: .python_job
  interruptible: false

staging:
  extends: .deploy
  stage: staging
  needs: [publish]
  resource_group: deploydock-staging
  environment: staging
  script:
    - pip install -q -r ci/controller-requirements.txt
    - ci/deploy release.json
    - cp release.json staged-release.json
  artifacts:
    paths: [staged-release.json]
    expire_in: 30 days
  rules:
    - if: '$DEPLOYDOCK_STAGING_ENABLED == "true"'

production:
  extends: .deploy
  stage: production
  needs: [staging]
  resource_group: deploydock-production
  environment: production
  script:
    - pip install -q -r ci/controller-requirements.txt
    - ci/deploy staged-release.json
  rules:
    - if: '$DEPLOYDOCK_STAGING_ENABLED == "true" && $DEPLOYDOCK_PRODUCTION_ENABLED == "true"'
      when: manual
      allow_failure: false
